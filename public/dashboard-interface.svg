<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1b6962;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#15544f;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Main Container -->
  <rect x="10" y="10" width="580" height="380" rx="12" fill="#ffffff" filter="url(#shadow)" stroke="#e5e9e2" stroke-width="2"/>
  
  <!-- Header -->
  <rect x="10" y="10" width="580" height="50" rx="12" fill="url(#headerGrad)"/>
  <rect x="10" y="40" width="580" height="20" fill="url(#headerGrad)"/>
  
  <!-- Header Content -->
  <text x="30" y="40" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">onePOS Dashboard</text>
  <text x="450" y="40" font-family="Arial, sans-serif" font-size="12" fill="#eaf2d3">Today, 17 September 2026</text>
  
  <!-- Main Content Area -->
  <rect x="10" y="60" width="580" height="330" fill="#f5f5f1"/>
  
  <!-- Summary Cards -->
  <rect x="30" y="80" width="120" height="80" rx="8" fill="#ffffff" stroke="#e5e9e2"/>
  <text x="90" y="105" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#50605a" text-anchor="middle">TODAY'S SALES</text>
  <text x="90" y="130" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#152321" text-anchor="middle">£2,847</text>
  <text x="90" y="148" font-family="Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle">+12.5% vs yesterday</text>
  
  <rect x="160" y="80" width="120" height="80" rx="8" fill="#ffffff" stroke="#e5e9e2"/>
  <text x="220" y="105" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#50605a" text-anchor="middle">TRANSACTIONS</text>
  <text x="220" y="130" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#152321" text-anchor="middle">142</text>
  <text x="220" y="148" font-family="Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle">+8.3% vs yesterday</text>
  
  <rect x="290" y="80" width="120" height="80" rx="8" fill="#ffffff" stroke="#e5e9e2"/>
  <text x="350" y="105" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#50605a" text-anchor="middle">AVERAGE SALE</text>
  <text x="350" y="130" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#152321" text-anchor="middle">£20.05</text>
  <text x="350" y="148" font-family="Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle">+3.2% vs yesterday</text>
  
  <rect x="420" y="80" width="120" height="80" rx="8" fill="#ffffff" stroke="#e5e9e2"/>
  <text x="480" y="105" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#50605a" text-anchor="middle">LOW STOCK</text>
  <text x="480" y="130" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#dc2626" text-anchor="middle">8</text>
  <text x="480" y="148" font-family="Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle">Needs attention</text>
  
  <!-- Chart Section -->
  <rect x="30" y="180" width="360" height="200" rx="8" fill="#ffffff" stroke="#e5e9e2"/>
  <text x="210" y="205" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#152321" text-anchor="middle">Sales Overview - Last 7 Days</text>
  
  <!-- Chart Bars -->
  <rect x="50" y="280" width="30" height="80" rx="4" fill="#1b6962"/>
  <rect x="90" y="260" width="30" height="100" rx="4" fill="#1b6962"/>
  <rect x="130" y="300" width="30" height="60" rx="4" fill="#1b6962"/>
  <rect x="170" y="240" width="30" height="120" rx="4" fill="#1b6962"/>
  <rect x="210" y="290" width="30" height="70" rx="4" fill="#1b6962"/>
  <rect x="250" y="250" width="30" height="110" rx="4" fill="#1b6962"/>
  <rect x="290" y="270" width="30" height="90" rx="4" fill="#1b6962"/>
  
  <!-- Chart Labels -->
  <text x="65" y="375" font-family="Arial, sans-serif" font-size="10" fill="#50605a" text-anchor="middle">Mon</text>
  <text x="105" y="375" font-family="Arial, sans-serif" font-size="10" fill="#50605a" text-anchor="middle">Tue</text>
  <text x="145" y="375" font-family="Arial, sans-serif" font-size="10" fill="#50605a" text-anchor="middle">Wed</text>
  <text x="185" y="375" font-family="Arial, sans-serif" font-size="10" fill="#50605a" text-anchor="middle">Thu</text>
  <text x="225" y="375" font-family="Arial, sans-serif" font-size="10" fill="#50605a" text-anchor="middle">Fri</text>
  <text x="265" y="375" font-family="Arial, sans-serif" font-size="10" fill="#50605a" text-anchor="middle">Sat</text>
  <text x="305" y="375" font-family="Arial, sans-serif" font-size="10" fill="#50605a" text-anchor="middle">Sun</text>
  
  <!-- Top Products Section -->
  <rect x="410" y="180" width="160" height="200" rx="8" fill="#ffffff" stroke="#e5e9e2"/>
  <text x="490" y="205" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#152321" text-anchor="middle">Top Products</text>
  
  <!-- Product Rankings -->
  <rect x="425" y="220" width="130" height="25" rx="4" fill="#f5f5f1"/>
  <circle cx="435" cy="232" r="8" fill="#1b6962"/>
  <text x="435" y="236" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="450" y="236" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#152321">Product A</text>
  <text x="545" y="236" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1b6962" text-anchor="end">£456</text>
  
  <rect x="425" y="250" width="130" height="25" rx="4" fill="#f5f5f1"/>
  <circle cx="435" cy="262" r="8" fill="#1b6962"/>
  <text x="435" y="266" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="450" y="266" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#152321">Product B</text>
  <text x="545" y="266" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1b6962" text-anchor="end">£312</text>
  
  <rect x="425" y="280" width="130" height="25" rx="4" fill="#f5f5f1"/>
  <circle cx="435" cy="292" r="8" fill="#1b6962"/>
  <text x="435" y="296" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="450" y="296" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#152321">Product C</text>
  <text x="545" y="296" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1b6962" text-anchor="end">£289</text>
  
  <rect x="425" y="310" width="130" height="25" rx="4" fill="#f5f5f1"/>
  <circle cx="435" cy="322" r="8" fill="#1b6962"/>
  <text x="435" y="326" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="450" y="326" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#152321">Product D</text>
  <text x="545" y="326" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1b6962" text-anchor="end">£245</text>
  
  <rect x="425" y="340" width="130" height="25" rx="4" fill="#f5f5f1"/>
  <circle cx="435" cy="352" r="8" fill="#1b6962"/>
  <text x="435" y="356" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="450" y="356" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#152321">Product E</text>
  <text x="545" y="356" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1b6962" text-anchor="end">£198</text>
</svg>