<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1b6962;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#15544f;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Main Container -->
  <rect x="10" y="10" width="580" height="380" rx="12" fill="#ffffff" filter="url(#shadow)" stroke="#e5e9e2" stroke-width="2"/>
  
  <!-- Header -->
  <rect x="10" y="10" width="580" height="50" rx="12" fill="url(#headerGrad)"/>
  <rect x="10" y="40" width="580" height="20" fill="url(#headerGrad)"/>
  
  <!-- Header Content -->
  <text x="30" y="40" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">onePOS</text>
  <text x="500" y="40" font-family="Arial, sans-serif" font-size="12" fill="#eaf2d3">● Live Session</text>
  
  <!-- Main Content Area -->
  <rect x="10" y="60" width="580" height="330" fill="#f5f5f1"/>
  
  <!-- Sidebar -->
  <rect x="10" y="60" width="120" height="330" fill="#ffffff" stroke="#e5e9e2" stroke-width="1"/>
  
  <!-- Categories -->
  <rect x="20" y="80" width="100" height="30" rx="6" fill="#1b6962"/>
  <text x="70" y="100" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">All Products</text>
  
  <rect x="20" y="120" width="100" height="30" rx="6" fill="#f5f5f1" stroke="#e5e9e2"/>
  <text x="70" y="140" font-family="Arial, sans-serif" font-size="11" fill="#50605a" text-anchor="middle">Beverages</text>
  
  <rect x="20" y="160" width="100" height="30" rx="6" fill="#f5f5f1" stroke="#e5e9e2"/>
  <text x="70" y="180" font-family="Arial, sans-serif" font-size="11" fill="#50605a" text-anchor="middle">Snacks</text>
  
  <rect x="20" y="200" width="100" height="30" rx="6" fill="#f5f5f1" stroke="#e5e9e2"/>
  <text x="70" y="220" font-family="Arial, sans-serif" font-size="11" fill="#50605a" text-anchor="middle">Groceries</text>
  
  <!-- Product Grid -->
  <rect x="140" y="80" width="280" height="200" fill="#ffffff" stroke="#e5e9e2" stroke-width="1"/>
  
  <!-- Product Cards -->
  <rect x="150" y="90" width="80" height="80" rx="8" fill="#f5f5f1" stroke="#e5e9e2"/>
  <text x="190" y="115" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">📦</text>
  <text x="190" y="140" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#152321" text-anchor="middle">Product A</text>
  <text x="190" y="155" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1b6962" text-anchor="middle">£4.99</text>
  
  <rect x="240" y="90" width="80" height="80" rx="8" fill="#f5f5f1" stroke="#e5e9e2"/>
  <text x="280" y="115" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">📦</text>
  <text x="280" y="140" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#152321" text-anchor="middle">Product B</text>
  <text x="280" y="155" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1b6962" text-anchor="middle">£2.49</text>
  
  <rect x="330" y="90" width="80" height="80" rx="8" fill="#f5f5f1" stroke="#e5e9e2"/>
  <text x="370" y="115" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">📦</text>
  <text x="370" y="140" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#152321" text-anchor="middle">Product C</text>
  <text x="370" y="155" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1b6962" text-anchor="middle">£7.99</text>
  
  <rect x="150" y="180" width="80" height="80" rx="8" fill="#f5f5f1" stroke="#e5e9e2"/>
  <text x="190" y="205" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">📦</text>
  <text x="190" y="230" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#152321" text-anchor="middle">Product D</text>
  <text x="190" y="245" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1b6962" text-anchor="middle">£1.99</text>
  
  <rect x="240" y="180" width="80" height="80" rx="8" fill="#f5f5f1" stroke="#e5e9e2"/>
  <text x="280" y="205" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">📦</text>
  <text x="280" y="230" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#152321" text-anchor="middle">Product E</text>
  <text x="280" y="245" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1b6962" text-anchor="middle">£3.99</text>
  
  <!-- Cart Panel -->
  <rect x="430" y="80" width="150" height="310" fill="#ffffff" stroke="#e5e9e2" stroke-width="1"/>
  
  <!-- Cart Header -->
  <text x="505" y="105" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#152321" text-anchor="middle">Current Sale</text>
  <line x1="440" y1="115" x2="570" y2="115" stroke="#e5e9e2" stroke-width="1"/>
  
  <!-- Cart Items -->
  <text x="445" y="140" font-family="Arial, sans-serif" font-size="11" fill="#50605a">Product A x2</text>
  <text x="565" y="140" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#152321" text-anchor="end">£9.98</text>
  
  <text x="445" y="160" font-family="Arial, sans-serif" font-size="11" fill="#50605a">Product B x1</text>
  <text x="565" y="160" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#152321" text-anchor="end">£2.49</text>
  
  <text x="445" y="180" font-family="Arial, sans-serif" font-size="11" fill="#50605a">Product C x1</text>
  <text x="565" y="180" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#152321" text-anchor="end">£7.99</text>
  
  <!-- Cart Total -->
  <line x1="440" y1="200" x2="570" y2="200" stroke="#e5e9e2" stroke-width="2"/>
  <text x="445" y="220" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#152321">Total</text>
  <text x="565" y="220" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1b6962" text-anchor="end">£20.46</text>
  
  <!-- Cart Actions -->
  <rect x="445" y="250" width="60" height="30" rx="6" fill="#f5f5f1" stroke="#e5e9e2"/>
  <text x="475" y="270" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#152321" text-anchor="middle">Hold</text>
  
  <rect x="515" y="250" width="60" height="30" rx="6" fill="#1b6962"/>
  <text x="545" y="270" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Pay</text>
  
  <!-- Customer Section -->
  <text x="445" y="320" font-family="Arial, sans-serif" font-size="10" fill="#50605a">Customer:</text>
  <text x="445" y="335" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1b6962">+ Add Customer</text>
  
  <!-- Search Bar -->
  <rect x="140" y="290" width="280" height="35" rx="6" fill="#ffffff" stroke="#e5e9e2"/>
  <text x="155" y="312" font-family="Arial, sans-serif" font-size="12" fill="#9aaa9f">🔍 Search products or scan barcode...</text>
</svg>