name: Build Linux Node Modules

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout onePOS
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Create Linux node_modules archive
        run: tar -czf onepos-linux-node-modules.tar.gz node_modules

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: onepos-linux-node-modules
          path: onepos-linux-node-modules.tar.gz
          retention-days: 7
